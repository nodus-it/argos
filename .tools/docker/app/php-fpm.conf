[global]
error_log = /dev/stderr

[www]
user  = www-data
group = www-data

; A unix socket in a volume shared only with nginx: never a TCP port. The app
; container also sits on argos_ws, where agent code in workspaces runs — a
; reachable FastCGI port would let it run PHP here (and drive the docker socket).
listen       = /run/argos-fpm/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0666

pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; Pass environment variables through to PHP
clear_env = no

; HOME for www-data so the docker CLI (invoked from PhaseRunner) finds its
; config under /var/www/.docker instead of root's home.
env[HOME] = /var/www

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors]  = on
