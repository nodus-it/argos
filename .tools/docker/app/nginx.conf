server {
    listen 80;
    root /app/public;
    index index.php;

    client_max_body_size 64M;

    # Argos itself is never framed by another site, never sniffed into a
    # different content type, and does not leak full URLs to other origins.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # PHP-FPM lives in the `app` service and listens only on a unix socket
        # in the shared argos-fpm volume (never on the workspace network).
        fastcgi_pass unix:/run/argos-fpm/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
